[build-system]
requires = ["setuptools>=43"]
build-backend = "setuptools.build_meta"

[project]
name = "eso-helper-addons"
version = "1.0.2"
requires-python = ">=3.11"
dependencies = [
    "PySide6>=6.6.0",
    "requests>=2.31.0",
    "beautifulsoup4>=4.12.0",
    "lxml>=4.9.0",
]

[project.scripts]
eso-helper-addons = "src.main:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]
