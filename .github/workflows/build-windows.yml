name: Build Windows

# PyInstaller doesn't cross-compile, so a Windows build has to run on a
# Windows machine -- windows-latest here instead of a dev box (see
# packaging/win/build.bat, which this mirrors step for step).

on:
  push:
    branches: [main]
    paths:
      - 'main.py'
      - 'viewer/**'
      - 'addon_manager/**'
      - 'packaging/**'
      - '.github/workflows/build-windows.yml'
  workflow_dispatch: {}

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: |
            viewer/requirements.txt
            addon_manager/requirements.txt

      - name: Install dependencies
        run: |
          pip install -r viewer/requirements.txt
          pip install -r addon_manager/requirements.txt
          pip install pyinstaller

      - name: Build
        run: pyinstaller packaging/eso-helper.spec --noconfirm

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: eso-helper-windows
          path: dist/eso-helper/
